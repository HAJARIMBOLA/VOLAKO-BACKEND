services:
  postgres:
    image: postgres:16-alpine
    container_name: volako-postgres
    environment:
      POSTGRES_DB: volako
      POSTGRES_USER: volako
      POSTGRES_PASSWORD: volako
    ports:
      # Host port 5433 avoids clashing with a native PostgreSQL install on 5432.
      - "5433:5432"
    volumes:
      - volako-data:/var/lib/postgresql/data

volumes:
  volako-data:
